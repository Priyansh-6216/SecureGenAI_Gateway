server:
  port: 8087

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/securegenai_audit
    username: securegenai_user
    password: securegenai_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
