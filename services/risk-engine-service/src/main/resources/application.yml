server:
  port: 8084

spring:
  application:
    name: risk-engine-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securegenai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none # Managed by API Gateway Flyway scripts
    show-sql: false

logging:
  level:
    com.securegenai: DEBUG
