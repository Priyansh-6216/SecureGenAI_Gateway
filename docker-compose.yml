services:
  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - securegenai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securegenai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - securegenai-network
    depends_on:
      - gateway-service

networks:
  securegenai-network:
    driver: bridge
